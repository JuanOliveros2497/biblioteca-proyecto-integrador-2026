<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Libros - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/libros"><i class="bi bi-book"></i> Biblioteca</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/libros"><i class="bi bi-book"></i> Libros</a>
            <a class="nav-link" href="/prestamos"><i class="bi bi-bookmark"></i> Préstamos</a>
            <a sec:authorize="hasRole('ADMIN')" class="nav-link" href="/categorias">
                <i class="bi bi-tags"></i> Categorías
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm ms-2" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- TÍTULO Y BOTÓN NUEVO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title"><i class="bi bi-book"></i> Catálogo de Libros</h2>
        <a sec:authorize="hasRole('ADMIN')" href="/libros/nuevo" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nuevo Libro
        </a>
    </div>

    <!-- BÚSQUEDA -->
    <form method="get" action="/libros" class="mb-4">
        <div class="input-group">
            <input type="text" name="buscar" class="form-control search-box"
                   placeholder="Buscar por título o autor..."
                   th:value="${buscar}">
            <button class="btn btn-warning" type="submit">
                <i class="bi bi-search"></i> Buscar
            </button>
            <a href="/libros" class="btn btn-outline-dark">
                <i class="bi bi-x"></i> Limpiar
            </a>
        </div>
    </form>

    <!-- LISTA DE LIBROS -->
    <div class="row" th:if="${not #lists.isEmpty(libros)}">
        <div class="col-md-4 mb-4" th:each="libro : ${libros}">
            <div class="card libro-card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${libro.titulo}"></h5>
                    <h6 class="card-subtitle mb-2" th:text="${libro.autor}"></h6>
                    <p class="card-text text-muted small" th:text="${libro.descripcion}"></p>
                    <div class="mb-2">
                        <span th:if="${libro.categoria}" class="badge bg-secondary"
                              th:text="${libro.categoria.nombre}"></span>
                    </div>
                    <div class="mb-3">
                        <span th:if="${libro.disponible}" class="badge-disponible">
                            <i class="bi bi-check-circle"></i> Disponible
                        </span>
                        <span th:unless="${libro.disponible}" class="badge-nodisponible">
                            <i class="bi bi-x-circle"></i> No disponible
                        </span>
                        <small class="text-muted ms-2"
                               th:text="'(' + ${libro.cantidadDisponible} + '/' + ${libro.cantidad} + ')'">
                        </small>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <div class="d-flex gap-2">
                        <a th:if="${libro.disponible}"
                           th:href="@{/prestamos/nuevo/{id}(id=${libro.id})}"
                           class="btn btn-warning btn-sm">
                            <i class="bi bi-bookmark-plus"></i> Prestar
                        </a>
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/libros/editar/{id}(id=${libro.id})}"
                           class="btn btn-outline-dark btn-sm">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/libros/eliminar/{id}(id=${libro.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('¿Eliminar este libro?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SIN RESULTADOS -->
    <div th:if="${#lists.isEmpty(libros)}" class="text-center py-5">
        <i class="bi bi-book" style="font-size: 4rem; color: #ccc;"></i>
        <h4 class="text-muted mt-3">No hay libros disponibles</h4>
        <a sec:authorize="hasRole('ADMIN')" href="/libros/nuevo" class="btn btn-primary mt-2">
            <i class="bi bi-plus-circle"></i> Agregar primer libro
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
