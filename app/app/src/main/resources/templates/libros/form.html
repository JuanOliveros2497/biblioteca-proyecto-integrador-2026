<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libro - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/libros"><i class="bi bi-book"></i> Biblioteca</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/libros"><i class="bi bi-book"></i> Libros</a>
            <a class="nav-link" href="/prestamos"><i class="bi bi-bookmark"></i> Préstamos</a>
            <a class="nav-link" href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm ms-2" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-book"></i>
                    <span th:if="${libro.id == null}"> Nuevo Libro</span>
                    <span th:unless="${libro.id == null}"> Editar Libro</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="${libro.id == null ? '/libros/nuevo' : '/libros/editar/' + libro.id}"
                          method="post" th:object="${libro}">

                        <div class="mb-3">
                            <label class="form-label">Título *</label>
                            <input type="text" th:field="*{titulo}" class="form-control"
                                   placeholder="Título del libro" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Autor *</label>
                            <input type="text" th:field="*{autor}" class="form-control"
                                   placeholder="Nombre del autor" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ISBN</label>
                            <input type="text" th:field="*{isbn}" class="form-control"
                                   placeholder="978-XXXXXXXXXX">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control"
                                      rows="3" placeholder="Descripción breve del libro"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Año de publicación</label>
                                <input type="number" th:field="*{anioPublicacion}"
                                       class="form-control" placeholder="2024">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Cantidad</label>
                                <input type="number" th:field="*{cantidad}"
                                       class="form-control" min="1" value="1">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Categoría</label>
                            <select th:field="*{categoria}" class="form-select">
                                <option value="">Sin categoría</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                            <a href="/libros" class="btn btn-outline-dark">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
