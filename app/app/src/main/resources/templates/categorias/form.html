<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categoría - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/libros"><i class="bi bi-book"></i> Biblioteca</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/libros"><i class="bi bi-book"></i> Libros</a>
            <a class="nav-link" href="/prestamos"><i class="bi bi-bookmark"></i> Préstamos</a>
            <a class="nav-link active" href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm ms-2" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-tags"></i>
                    <span th:if="${categoria.id == null}"> Nueva Categoría</span>
                    <span th:unless="${categoria.id == null}"> Editar Categoría</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="${categoria.id == null ? '/categorias/nueva' : '/categorias/editar/' + categoria.id}"
                          method="post" th:object="${categoria}">

                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   placeholder="Nombre de la categoría" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control"
                                      rows="3" placeholder="Descripción opcional"></textarea>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input type="checkbox" th:field="*{activa}"
                                       class="form-check-input" id="activa">
                                <label class="form-check-label" for="activa">Categoría activa</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                            <a href="/categorias" class="btn btn-outline-dark">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
