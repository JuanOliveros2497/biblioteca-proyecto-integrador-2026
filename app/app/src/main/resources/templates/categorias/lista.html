<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/libros"><i class="bi bi-book"></i> Biblioteca</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/libros"><i class="bi bi-book"></i> Libros</a>
            <a class="nav-link" href="/prestamos"><i class="bi bi-bookmark"></i> Préstamos</a>
            <a class="nav-link active" href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm ms-2" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title"><i class="bi bi-tags"></i> Categorías</h2>
        <a href="/categorias/nueva" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nueva Categoría
        </a>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${param.error}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="bi bi-list"></i> Lista de Categorías
        </div>
        <div class="card-body p-0">
            <div th:if="${not #lists.isEmpty(categorias)}">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat, iter : ${categorias}">
                            <td th:text="${iter.count}"></td>
                            <td th:text="${cat.nombre}"></td>
                            <td th:text="${cat.descripcion}"></td>
                            <td>
                                <span th:if="${cat.activa}" class="badge-disponible">Activa</span>
                                <span th:unless="${cat.activa}" class="badge-nodisponible">Inactiva</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/categorias/editar/{id}(id=${cat.id})}"
                                       class="btn btn-warning btn-sm">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <a th:href="@{/categorias/eliminar/{id}(id=${cat.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('¿Eliminar esta categoría?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(categorias)}" class="text-center py-5">
                <i class="bi bi-tags" style="font-size: 4rem; color: #ccc;"></i>
                <h5 class="text-muted mt-3">No hay categorías creadas</h5>
                <a href="/categorias/nueva" class="btn btn-primary mt-2">
                    <i class="bi bi-plus-circle"></i> Crear primera categoría
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
