<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Préstamo - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/libros"><i class="bi bi-book"></i> Biblioteca</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/libros"><i class="bi bi-book"></i> Libros</a>
            <a class="nav-link" href="/prestamos"><i class="bi bi-bookmark"></i> Préstamos</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm ms-2" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-bookmark-plus"></i> Confirmar Préstamo
                </div>
                <div class="card-body p-4">
                    <div th:if="${libro != null}">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            El préstamo tiene una duración de <strong>15 días</strong>
                        </div>
                        <table class="table">
                            <tr>
                                <td><strong>Libro:</strong></td>
                                <td th:text="${libro.titulo}"></td>
                            </tr>
                            <tr>
                                <td><strong>Autor:</strong></td>
                                <td th:text="${libro.autor}"></td>
                            </tr>
                            <tr>
                                <td><strong>Disponibles:</strong></td>
                                <td th:text="${libro.cantidadDisponible}"></td>
                            </tr>
                        </table>
                        <form th:action="@{/prestamos/nuevo/{id}(id=${libro.id})}" method="post">
                            <div class="d-flex gap-2 mt-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Confirmar préstamo
                                </button>
                                <a href="/libros" class="btn btn-outline-dark">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
